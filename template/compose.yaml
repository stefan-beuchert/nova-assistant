# Atlas project compose file.
#
# Per the root atlas repo's docs/STANDARDS.md and this template's
# docs/platform-assumptions.md:
#   - No bundled PostgreSQL — the platform provides it (POSTGRES_HOST=postgres
#     on the shared network below), one database + user per app.
#   - Routing is NOT done via compose labels. The shared reverse proxy is
#     Caddy, configured by a static Caddyfile in atlas-infrastructure. Ask
#     for a site block to be added there (and the Caddy container
#     recreated — `caddy reload` alone won't pick it up) rather than adding
#     labels here.

services:
  app:
    build: .
    env_file:
      - .env
    restart: unless-stopped
    # TODO: expose only if you need to reach this service directly during
    # local development. Once behind Caddy, this isn't needed in production
    # — Caddy reaches this service by its compose service name on the
    # shared network instead.
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    networks:
      - atlas

networks:
  # The real shared Atlas Docker network. Marked external because it's
  # created by the platform (atlas-infrastructure), not by this project.
  atlas:
    external: true
