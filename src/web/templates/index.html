<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nova</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --panel-2: #1f2430;
      --text: #e6e8ec; --muted: #9aa3b2; --accent: #7aa2f7; --user: #2a3348;
      --border: #272c38;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column;
      /* dvh tracks the *visible* viewport, so the input bar never falls below
         the mobile address bar; vh is the fallback for older browsers. The body
         itself never scrolls — only #log does (see min-height: 0 there). */
      height: 100vh; height: 100dvh; overflow: hidden;
    }
    header {
      padding: 12px 18px; border-bottom: 1px solid var(--border);
      display: flex; align-items: baseline; gap: 10px;
    }
    header h1 { font-size: 16px; margin: 0; letter-spacing: .3px; }
    header .sub { color: var(--muted); font-size: 12px; }
    header .spacer { flex: 1; }
    header button {
      background: var(--panel-2); color: var(--muted); border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer;
    }
    header button:hover { color: var(--text); }
    header button.on { color: var(--accent); border-color: var(--accent); }
    header select {
      background: var(--panel-2); color: var(--muted); border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 8px; font: inherit; font-size: 12px; cursor: pointer;
    }
    header select:hover { color: var(--text); }

    /* min-height: 0 lets this flex child shrink below its content and scroll,
       instead of growing the page; it is the only scrollable region. */
    #log { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 18px; }
    #thread {
      max-width: 820px; margin: 0 auto;
      display: flex; flex-direction: column; gap: 14px;
    }

    .msg { max-width: 92%; width: fit-content; padding: 10px 14px; border-radius: 12px; word-wrap: break-word; overflow-wrap: anywhere; }
    .msg.user { align-self: flex-end; background: var(--user); white-space: pre-wrap; }
    .msg.nova { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }

    /* Rendered markdown inside Nova's replies. */
    .msg.nova .md > :first-child { margin-top: 0; }
    .msg.nova .md > :last-child { margin-bottom: 0; }
    .msg.nova p { margin: 0 0 8px; }
    .msg.nova h1, .msg.nova h2, .msg.nova h3 { margin: 12px 0 6px; line-height: 1.25; }
    .msg.nova h1 { font-size: 18px; }
    .msg.nova h2 { font-size: 16px; }
    .msg.nova h3 { font-size: 15px; }
    .msg.nova ul, .msg.nova ol { margin: 6px 0; padding-left: 22px; }
    .msg.nova li { margin: 2px 0; }
    .msg.nova code {
      background: var(--panel-2); padding: 1px 5px; border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px;
    }
    .msg.nova pre {
      background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; overflow-x: auto; margin: 8px 0;
    }
    .msg.nova pre code { background: none; padding: 0; font-size: 12.5px; }
    .msg.nova a { color: var(--accent); }

    /* Per-reply "read aloud" control (text-to-speech). */
    .msg.nova .speak {
      display: inline-flex; align-items: center; justify-content: center;
      margin-top: 8px; width: 28px; height: 24px; padding: 0; line-height: 1;
      background: var(--panel-2); color: var(--muted);
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 13px; cursor: pointer;
    }
    .msg.nova .speak:hover { color: var(--text); }
    .msg.nova .speak.on { color: var(--accent); border-color: var(--accent); }

    /* Grounding chips: which source/tool Nova used. */
    .tools { align-self: flex-start; display: flex; flex-wrap: wrap; gap: 6px; max-width: 92%; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11.5px; color: var(--muted);
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 999px; padding: 3px 10px;
    }
    .chip b { color: var(--text); font-weight: 600; }
    .chip .ico { opacity: .85; }

    .status { align-self: flex-start; color: var(--muted); font-size: 12px; font-style: italic; }
    .err { align-self: flex-start; color: #f7768e; font-size: 13px; }

    form { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--border); }
    #input {
      flex: 1; resize: none; background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font: inherit;
    }
    #send { background: var(--accent); color: #0f1115; border: none; border-radius: 8px; padding: 0 18px; font-weight: 600; cursor: pointer; }
    #send:disabled { opacity: .5; cursor: default; }
    /* Voice input (speech-to-text) mic button. */
    #mic {
      background: var(--panel-2); color: var(--muted); border: 1px solid var(--border);
      border-radius: 8px; padding: 0 12px; font-size: 16px; cursor: pointer; line-height: 1;
    }
    #mic:hover { color: var(--text); }
    #mic.on { color: var(--accent); border-color: var(--accent); }

    .empty { color: var(--muted); align-self: center; margin-top: 10vh; text-align: center; }
    .empty code { background: var(--panel-2); padding: 1px 6px; border-radius: 4px; }

    /* Jump-to-latest, shown only when scrolled up. */
    #jump {
      position: fixed; right: 22px; bottom: 86px; display: none;
      align-items: center; gap: 6px;
      background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 999px; padding: 7px 12px; font-size: 12px; cursor: pointer;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .45);
    }
    #jump.show { display: inline-flex; }

    @media (max-width: 640px) {
      header { padding: 10px 12px; }
      /* Drop the subtitle so the model switcher + buttons fit without overflow. */
      header .sub { display: none; }
      #log { padding: 12px; }
      form { padding: 10px 12px; }
      .msg, .tools { max-width: 100%; }
      #jump { right: 12px; bottom: 78px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Nova</h1>
    <span class="sub">Atlas personal assistant · read-only</span>
    <span class="spacer"></span>
    {% if models|length > 1 %}
    <select id="model" title="Reasoning model" aria-label="Reasoning model">
      {% for m in models %}
      <option value="{{ m.id }}"{% if m.id == default_model %} selected{% endif %}>{{ m.label }}</option>
      {% endfor %}
    </select>
    {% endif %}
    <button id="speak" type="button" hidden aria-pressed="false"
            title="Read Nova's replies aloud (on-device)">🔊 Speak</button>
    <button id="reset" type="button">New chat</button>
  </header>

  <div id="log">
    <div id="thread">
      <div class="empty" id="empty">
        Ask about your Atlas data.<br />
        <span class="sub">Proof of concept — try <code>what time is it?</code></span>
      </div>
    </div>
  </div>

  <button id="jump" type="button">↓ Latest</button>

  <form id="form">
    <textarea id="input" rows="1" placeholder="Message Nova…" autocomplete="off"></textarea>
    <button id="mic" type="button" hidden aria-pressed="false"
            title="Dictate your message">🎤</button>
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    const log = document.getElementById("log");
    const thread = document.getElementById("thread");
    const empty = document.getElementById("empty");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const jump = document.getElementById("jump");
    const speakToggle = document.getElementById("speak");
    const modelSelect = document.getElementById("model"); // absent when only one model is offered
    const micBtn = document.getElementById("mic");

    // --- Model switcher: remember the chosen Claude across reloads. The actual set
    // of options is server-rendered from the config allowlist (Config.MODELS); the
    // server re-validates every /chat against it, so a stale saved id simply falls
    // back to the configured default.
    if (modelSelect) {
      const saved = localStorage.getItem("nova.model");
      if (saved && [...modelSelect.options].some((o) => o.value === saved)) {
        modelSelect.value = saved;
      }
      modelSelect.addEventListener("change", () => {
        localStorage.setItem("nova.model", modelSelect.value);
      });
    }

    // --- Speech-to-text (voice input): dictate into the message box via the
    // browser's SpeechRecognition. NOTE: unlike the on-device TTS above, this is
    // NOT local — Chrome/Edge stream the audio to Google's speech service to
    // transcribe it. That is a deliberate, accepted trade for the PoC: the query
    // text already goes to Anthropic, so this adds the same queries (as audio) to
    // one more vendor, and never touches the hard-denied data classes. Revisit with
    // a self-hosted transcriber once the homelab can host one. The button is hidden
    // where the API is absent (e.g. Firefox), so this is purely additive.
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recog = null, listening = false, recogBase = "", micWatchdog = null;

    // Reset the mic button to idle. Called from every exit path (onend, onerror,
    // a failed start, and the watchdog) so the button can never get stuck in ⏹.
    function resetMic() {
      listening = false;
      if (micWatchdog) { clearTimeout(micWatchdog); micWatchdog = null; }
      micBtn.textContent = "🎤";
      micBtn.classList.remove("on");
      micBtn.setAttribute("aria-pressed", "false");
    }
    // Turn a SpeechRecognition error code into something actionable. These are the
    // common deployed-site failures: the browser needs mic permission AND a trusted
    // HTTPS origin, and (in Chrome/Edge) network access to Google's speech backend.
    function dictationErrorText(code) {
      switch (code) {
        case "not-allowed":
        case "service-not-allowed":
          return "Voice input blocked: allow microphone access for this site. It also " +
                 "needs a trusted HTTPS origin — if nova.atlas uses a cert your browser " +
                 "doesn't trust, the mic stays blocked.";
        case "network":
          return "Voice input failed: the browser couldn't reach the speech service " +
                 "(Chrome/Edge send audio to Google to transcribe). Check this device's " +
                 "internet access.";
        case "audio-capture":
          return "Voice input failed: no microphone was found.";
        case "no-speech":
          return "Didn't catch any speech — tap the mic and try again.";
        case "aborted":
          return ""; // user-initiated stop; not an error worth showing
        default:
          return "Voice input error: " + code + ".";
      }
    }

    function stopDictation() { if (recog && listening) { try { recog.stop(); } catch (e) {} } }
    function startDictation() {
      recog = new SpeechRecognition();
      recog.lang = navigator.language || "en-US";
      recog.interimResults = true; // live preview as you speak
      recog.continuous = false;    // one utterance, stops on a natural pause
      // Dictation appends to whatever is already typed, rather than replacing it.
      recogBase = input.value.replace(/\s+$/, "");
      if (recogBase) recogBase += " ";
      recog.onresult = (e) => {
        let text = "";
        for (let i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
        input.value = recogBase + text;
        autosize();
      };
      // onstart fires once the engine is actually capturing; we use it to cancel
      // the watchdog below. If it never fires, the mic is blocked and no other
      // event will come either — the watchdog is the only way out of that hang.
      recog.onstart = () => { if (micWatchdog) { clearTimeout(micWatchdog); micWatchdog = null; } };
      recog.onerror = (e) => {
        const msg = dictationErrorText(e.error);
        if (msg) addNote("err", msg); // surface the reason instead of failing silently
        resetMic();
      };
      recog.onend = () => { resetMic(); input.focus(); };
      try {
        recog.start();
      } catch (e) {
        // start() throws e.g. if called while already running; don't get stuck.
        resetMic();
        addNote("err", "Couldn't start voice input: " + e.message);
        return;
      }
      listening = true;
      micBtn.textContent = "⏹";
      micBtn.classList.add("on");
      micBtn.setAttribute("aria-pressed", "true");
      // Recover from a silent, eventless hang (mic blocked / untrusted origin):
      // if the engine hasn't started capturing shortly after start(), bail out
      // and explain. onstart clears this; a real long dictation is unaffected.
      micWatchdog = setTimeout(() => {
        if (!listening) return;
        try { recog.abort(); } catch (e) {}
        resetMic();
        addNote("err",
          "Voice input didn't start. Most likely the microphone is blocked for this " +
          "site, or nova.atlas isn't a trusted HTTPS origin in this browser. Check the " +
          "mic permission (address-bar icon) and that the page padlock is valid.");
      }, 4000);
    }

    if (SpeechRecognition) {
      micBtn.hidden = false;
      micBtn.addEventListener("click", () => (listening ? stopDictation() : startDictation()));
    }

    // --- Text-to-speech: read Nova's replies aloud with the browser's built-in
    // speechSynthesis. This runs on-device — no audio or text leaves the machine,
    // so it adds no new data egress (unlike cloud speech services). Off by default;
    // the header toggle (persisted) auto-speaks each new reply, and every reply has
    // a speaker button to play/stop it on demand. One utterance plays at a time.
    const tts = window.speechSynthesis;
    const ttsSupported = !!tts && typeof window.SpeechSynthesisUtterance === "function";
    let autoSpeak = ttsSupported && localStorage.getItem("nova.autospeak") === "1";
    let speakingBtn = null; // the speaker button whose reply is currently playing

    function resetSpeakBtn() {
      if (speakingBtn) { speakingBtn.textContent = "🔊"; speakingBtn.classList.remove("on"); speakingBtn = null; }
    }
    function stopSpeech() { if (ttsSupported) tts.cancel(); resetSpeakBtn(); }
    // Speak `text`, reflecting play/stop state on `btn`. Tapping the button that's
    // already playing stops it (toggle); starting a new one cancels the previous.
    function speak(text, btn) {
      if (!ttsSupported) return;
      const toggleOff = btn && btn === speakingBtn;
      stopSpeech();
      text = (text || "").trim();
      if (toggleOff || !text) return;
      const u = new SpeechSynthesisUtterance(text);
      u.onend = u.onerror = () => { if (btn === speakingBtn) resetSpeakBtn(); };
      speakingBtn = btn || null;
      if (btn) { btn.textContent = "⏹"; btn.classList.add("on"); }
      tts.speak(u);
    }

    if (ttsSupported) {
      speakToggle.hidden = false;
      const reflect = () => {
        speakToggle.classList.toggle("on", autoSpeak);
        speakToggle.setAttribute("aria-pressed", String(autoSpeak));
      };
      reflect();
      speakToggle.addEventListener("click", () => {
        autoSpeak = !autoSpeak;
        localStorage.setItem("nova.autospeak", autoSpeak ? "1" : "0");
        reflect();
        if (!autoSpeak) stopSpeech();
      });
    }

    // Private-use sentinels wrapping stashed code blocks. Never appear in model
    // output, so they can't collide with Nova's text; built at runtime so the source
    // file stays plain ASCII.
    const CB0 = String.fromCharCode(0xE000), CB1 = String.fromCharCode(0xE001);

    // --- Auto-scroll: stick to the bottom only when the user is already there,
    // so streaming never yanks them away from history they scrolled up to read.
    let stick = true;
    function nearBottom() {
      return log.scrollHeight - log.scrollTop - log.clientHeight < 80;
    }
    function scrollToBottom() { log.scrollTop = log.scrollHeight; }
    function keepPinned() { if (stick) scrollToBottom(); }
    log.addEventListener("scroll", () => {
      stick = nearBottom();
      jump.classList.toggle("show", !stick);
    });
    jump.addEventListener("click", () => { stick = true; scrollToBottom(); jump.classList.remove("show"); });

    // --- Minimal, self-contained markdown rendering for Nova's replies.
    // HTML is escaped first (tool data can contain '<'); only a safe subset of
    // markdown is then re-introduced. No external library, no build step (D5).
    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function renderInline(raw) {
      // Split out `code spans` so their contents aren't treated as markdown.
      return raw.split(/(`[^`]+`)/g).map((part) => {
        if (part.length >= 2 && part.startsWith("`") && part.endsWith("`")) {
          return "<code>" + escapeHtml(part.slice(1, -1)) + "</code>";
        }
        let t = escapeHtml(part);
        // Links — http(s) and mailto only (never javascript:/data: URIs).
        t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/g,
          (m, text, url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${text}</a>`);
        t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        t = t.replace(/__([^_]+)__/g, "<strong>$1</strong>");
        t = t.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
        t = t.replace(/(^|[^_\w])_([^_\n]+)_(?![_\w])/g, "$1<em>$2</em>");
        return t;
      }).join("");
    }
    function renderMarkdown(src) {
      src = src.replace(/\r\n?/g, "\n");
      // Pull out fenced code blocks first (closed, then any unclosed trailing
      // fence that's still streaming), leaving placeholders on their own lines.
      const code = [];
      const stash = (c) => { code.push(c); return "\n" + CB0 + (code.length - 1) + CB1 + "\n"; };
      src = src.replace(/```[^\n]*\n?([\s\S]*?)```/g, (m, c) => stash(c));
      src = src.replace(/```[^\n]*\n?([\s\S]*)$/g, (m, c) => stash(c));

      const cbLine = new RegExp("^" + CB0 + "(\\d+)" + CB1 + "$");
      const lines = src.split("\n");
      let html = "", list = null, para = [];
      const closeList = () => { if (list) { html += list === "ul" ? "</ul>" : "</ol>"; list = null; } };
      const flushPara = () => {
        if (para.length) { html += "<p>" + para.map(renderInline).join("<br>") + "</p>"; para = []; }
      };
      for (const line of lines) {
        let m;
        if ((m = line.match(cbLine))) {
          flushPara(); closeList();
          html += "<pre><code>" + escapeHtml(code[+m[1]].replace(/\n$/, "")) + "</code></pre>";
        } else if ((m = line.match(/^(#{1,3})\s+(.*)$/))) {
          flushPara(); closeList();
          const n = m[1].length;
          html += `<h${n}>${renderInline(m[2])}</h${n}>`;
        } else if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) {
          flushPara();
          if (list !== "ul") { closeList(); html += "<ul>"; list = "ul"; }
          html += "<li>" + renderInline(m[1]) + "</li>";
        } else if ((m = line.match(/^\s*\d+\.\s+(.*)$/))) {
          flushPara();
          if (list !== "ol") { closeList(); html += "<ol>"; list = "ol"; }
          html += "<li>" + renderInline(m[1]) + "</li>";
        } else if (line.trim() === "") {
          flushPara(); closeList();
        } else {
          para.push(line);
        }
      }
      flushPara(); closeList();
      return html;
    }

    // --- Log elements -------------------------------------------------------
    let toolRow = null; // the current run of grounding chips, reset per bubble

    function clearEmpty() { if (empty && empty.isConnected) empty.remove(); }

    function addUser(text) {
      clearEmpty();
      toolRow = null;
      const el = document.createElement("div");
      el.className = "msg user";
      el.textContent = text;
      thread.appendChild(el);
      keepPinned();
    }
    function addBubble() {
      toolRow = null;
      const el = document.createElement("div");
      el.className = "msg nova";
      el._raw = "";
      // Rendered markdown lives in its own child so the speaker button below it
      // survives each re-render (appendToken rewrites only _md.innerHTML), and so
      // speech reads the plain text (_md.textContent) without the button's glyph.
      const md = document.createElement("div");
      md.className = "md";
      el.appendChild(md);
      el._md = md;
      if (ttsSupported) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "speak";
        btn.textContent = "🔊";
        btn.setAttribute("aria-label", "Read this reply aloud");
        btn.title = "Read aloud";
        btn.addEventListener("click", () => speak(md.textContent, btn));
        el.appendChild(btn);
        el._speakBtn = btn;
      }
      thread.appendChild(el);
      keepPinned();
      return el;
    }
    function appendToken(bubble, text) {
      bubble._raw += text;
      bubble._md.innerHTML = renderMarkdown(bubble._raw);
      keepPinned();
    }
    function toolLabel(name) {
      let source = "Nova", tool = name;
      const i = name.indexOf("__");
      if (i >= 0) { source = name.slice(0, i); tool = name.slice(i + 2); }
      source = source.charAt(0).toUpperCase() + source.slice(1);
      return { source, tool: tool.replace(/_/g, " ") };
    }
    function addToolChip(name) {
      clearEmpty();
      if (!toolRow) { toolRow = document.createElement("div"); toolRow.className = "tools"; thread.appendChild(toolRow); }
      const { source, tool } = toolLabel(name);
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.innerHTML = `<span class="ico">🔎</span><b></b> · <span class="t"></span>`;
      chip.querySelector("b").textContent = source;
      chip.querySelector(".t").textContent = tool;
      toolRow.appendChild(chip);
      keepPinned();
    }
    function addNote(cls, text) {
      const el = document.createElement("div");
      el.className = cls;
      el.textContent = text;
      thread.appendChild(el);
      keepPinned();
      return el;
    }

    // --- A single transient activity line pinned to the bottom of the thread.
    let statusEl = null;
    function setStatus(text) {
      if (!statusEl) { statusEl = document.createElement("div"); statusEl.className = "status"; }
      statusEl.textContent = text;
      thread.appendChild(statusEl); // moves it to the end
      keepPinned();
    }
    function clearStatus() { if (statusEl && statusEl.isConnected) statusEl.remove(); }

    async function sendMessage(text) {
      stopSpeech(); // a new turn silences any reply still being read aloud
      addUser(text);
      stick = true; // following our own new message
      send.disabled = true;
      setStatus("…");
      let bubble = null;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, model: modelSelect ? modelSelect.value : undefined }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          clearStatus();
          addNote("err", body.error || ("Request failed: " + res.status));
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let nl;
          while ((nl = buf.indexOf("\n")) >= 0) {
            const line = buf.slice(0, nl).trim();
            buf = buf.slice(nl + 1);
            if (!line) continue;
            const ev = JSON.parse(line);
            if (ev.type === "status") {
              if (ev.value === "thinking") {
                setStatus("thinking…");
              } else if (ev.value.startsWith("tool:")) {
                addToolChip(ev.value.slice(5)); // persistent grounding chip
                bubble = null;                  // next text starts a fresh bubble below it
                setStatus("working…");
              }
            } else if (ev.type === "token") {
              if (!bubble) { clearStatus(); bubble = addBubble(); }
              appendToken(bubble, ev.text);
            } else if (ev.type === "error") {
              clearStatus();
              addNote("err", ev.message || "Something went wrong.");
            } else if (ev.type === "done") {
              clearStatus();
              // Auto-read the finished reply (the final bubble after any tool calls).
              if (autoSpeak && bubble && bubble._speakBtn) speak(bubble._md.textContent, bubble._speakBtn);
            }
          }
        }
      } catch (e) {
        clearStatus();
        addNote("err", "Connection lost: " + e.message);
      } finally {
        clearStatus();
        send.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      stopDictation();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      input.style.height = "auto";
      sendMessage(text);
    });

    function autosize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
    }
    input.addEventListener("input", autosize);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    });

    document.getElementById("reset").addEventListener("click", async () => {
      stopSpeech();
      await fetch("/reset", { method: "POST" });
      thread.innerHTML = "";
      thread.appendChild(empty);
      statusEl = null; toolRow = null; stick = true;
      jump.classList.remove("show");
      input.focus();
    });

    input.focus();
  </script>
</body>
</html>
